spring:
  application:
    name: gitgud-backend

  profiles:
    active: dev

  # Database Configuration
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration (Disabled - using Hibernate DDL auto-update)
  flyway:
    enabled: false

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        concurrency: 5
        max-concurrency: 10
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Spring MVC Configuration
  mvc:
    throw-exception-if-no-handler-found: true

  # Disable default static resource handling (prevents /** from intercepting API requests)
  web:
    resources:
      add-mappings: false

# Firebase Configuration
firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  service-account:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
    base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}

# Server Configuration
server:
  port: ${BACKEND_PORT}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ACTIVE_PROFILE}

# Code Execution Configuration
code:
  execution:
    timeout:
      seconds: ${CODE_EXECUTION_TIMEOUT_SECONDS}
    max:
      memory:
        mb: ${CODE_EXECUTION_MAX_MEMORY_MB}
    docker:
      host: tcp://localhost:2376
      timeout: 30
      image: ${CODE_EXECUTION_DOCKER_IMAGE}

# Logging Configuration
logging:
  level:
    root: ${ROOT_LOG_LEVEL}
    com.syntaxllama.gitgud: ${GITGUD_LOG_LEVEL}
    org.springframework.web: ${WEB_LOG_LEVEL}
    org.hibernate.SQL: ${SQL_LOG_LEVEL}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SQL_BINDER_LOG_LEVEL}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: ${ACTIVE_PROFILE}

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.syntaxllama.gitgud: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

---
# Production Profile (placeholder for future)
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.syntaxllama.gitgud: INFO
